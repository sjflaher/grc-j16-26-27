<head>

    <style>
        :root {
            --maroon: #460C85;
            --maroon-dark: #2d0855;
            --maroon-bright: #5a14aa;
            --ink: #1d1d24;
            --grey: #5c5c66;
            --paper: #faf8f5;
            --cream: #f1ece4;
            --gold: #c9a227;
            --white: #ffffff;
            --galway-red: #8b0000;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            padding: 4vh 4vw;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 4vh;
        }
        .kicker {
            font-size: 0.9rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 1vh;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--maroon);
            letter-spacing: -0.01em;
            margin-bottom: 1vh;
        }
        h1::after {
            content: "";
            display: block;
            width: 80px;
            height: 4px;
            background: var(--gold);
            margin: 1.5vh auto 0;
            border-radius: 2px;
        }
        .subtitle {
            color: var(--grey);
            font-size: 1rem;
            margin-top: 1vh;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 4vh;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--grey);
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid transparent;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .legend-color.galway { width: 18px; height: 18px; border-width: 3px; }
        .legend { gap: 14px 22px; }

        .day-section {
            margin-bottom: 5vh;
        }
        .day-header {
            text-align: center;
            margin-bottom: 3vh;
            padding: 2vh 0;
            border-bottom: 2px solid var(--cream);
        }
        .day-header h2 {
            font-size: 1.6rem;
            color: var(--maroon);
            font-weight: 700;
        }
        .day-header .day-subtitle {
            color: var(--grey);
            font-size: 0.9rem;
            margin-top: 0.5vh;
        }
        .events-grid {
            display: flex;
            flex-direction: column;
            gap: 4vh;
        }
        .event-card {
            background: var(--white);
            border-radius: 12px;
            padding: 3vh 3vw;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2.5vh;
            flex-wrap: wrap;
            gap: 2vh;
        }
        .event-title-section {
            flex: 1;
        }
        .event-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--maroon);
            margin-bottom: 0.5vh;
        }
        .event-subtitle {
            font-size: 0.85rem;
            color: var(--grey);
        }
        .event-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
            padding: 10px 18px;
            background: var(--cream);
            border-radius: 8px;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--maroon);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--grey);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .toggle-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toggle-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .toggle-label {
            font-size: 0.7rem;
            color: var(--grey);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 8px;
        }
        .toggle-btn {
            padding: 8px 16px;
            border: 2px solid var(--cream);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--white);
            color: var(--grey);
        }
        .toggle-btn:hover {
            border-color: var(--maroon-bright);
            color: var(--maroon);
        }
        .toggle-btn.active {
            background: var(--maroon);
            color: var(--white);
            border-color: var(--maroon);
        }
        .toggle-btn.watts-active {
            background: var(--gold);
            color: var(--ink);
            border-color: var(--gold);
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 2.5vh;
            background: var(--cream);
            border-radius: 8px;
            padding: 15px;
        }
        .galway-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .galway-crew {
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.08), rgba(139, 0, 0, 0.03));
            border: 1px solid rgba(139, 0, 0, 0.2);
            border-radius: 10px;
            padding: 18px;
        }
        .galway-crew h4 {
            color: var(--galway-red);
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }
        .galway-crew h4::before {
            content: '🚣';
            font-size: 1.1rem;
        }
        .crew-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 0.85rem;
        }
        .crew-stat {
            text-align: center;
        }
        .crew-stat-label {
            color: var(--grey);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .crew-stat-value {
            font-weight: 700;
            color: var(--ink);
            margin-top: 2px;
        }

        .position-change {
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            font-size: 0.85rem;
        }
        .position-change.positive {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
        }
        .position-change.negative {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
        }
        .position-change.neutral {
            background: var(--cream);
            color: var(--grey);
        }
        footer {
            text-align: center;
            margin-top: 5vh;
            padding-top: 3vh;
            border-top: 1px solid var(--cream);
            color: var(--grey);
            font-size: 0.85rem;
        }
        footer p {
            margin-bottom: 0.5vh;
        }
        .callout {
            background: var(--maroon);
            color: var(--white);
            padding: 2vh 2vw;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 3vh;
            text-align: center;
        }
        .callout .gold {
            color: var(--gold);
        }
        .highlight-box {
            background: linear-gradient(135deg, rgba(70, 12, 133, 0.08), rgba(70, 12, 133, 0.03));
            border: 1px solid rgba(70, 12, 133, 0.15);
            border-radius: 8px;
            padding: 14px 18px;
            margin-top: 15px;
        }
        .highlight-box h4 {
            color: var(--maroon);
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .highlight-box p {
            color: var(--grey);
            font-size: 0.85rem;
            line-height: 1.5;
        }
    </style>
</head>

        // Per-event set of crew names the user has clicked to highlight
        const selectedCrews = {};

        // Chart.js plugin: translucent vertical bar behind Galway points (always)
        // and behind any point the user has clicked (in that club's primary colour)
        const highlightBarsPlugin = {
            id: 'highlightBars',
            beforeDatasetsDraw(chart) {
                const { ctx, chartArea, scales } = chart;
                const selected = selectedCrews[chart.$eventName] || new Set();
                const halfWidth = Math.max(6, Math.min(16, (scales.x.getPixelForValue(1) - scales.x.getPixelForValue(0)) * 0.35));
                ctx.save();
                ctx.beginPath();
                ctx.rect(chartArea.left, chartArea.top, chartArea.right - chartArea.left, chartArea.bottom - chartArea.top);
                ctx.clip();
                chart.data.datasets.forEach(ds => {
                    const isGalway = ds.label === 'Galway';
                    ds.data.forEach(pt => {
                        const clicked = selected.has(pt.label);
                        if (!isGalway && !clicked) return;
                        const col = getClubColor(pt.club).primary;
                        const x = scales.x.getPixelForValue(pt.x);
                        ctx.fillStyle = hexToRgba(col, isGalway ? 0.16 : 0.26);
                        ctx.fillRect(x - halfWidth, chartArea.top, halfWidth * 2, chartArea.bottom - chartArea.top);
                    });
                });
                ctx.restore();
            }
        };

        const UNKNOWN_CLUB = { primary: '#9e9e9e', secondary: '#616161' };
        const unmappedClubs = new Set();

        // Resolve a crew/rower name to its club name
        function getClubName(name) {
            if (ROWER_CLUBS[name]) return ROWER_CLUBS[name];
            if (CLUB_COLORS[name]) return name;
            const base = name.replace(/\s+[A-Z]$/, '');   // "Enniskillen A" -> "Enniskillen"
            if (CLUB_COLORS[base]) return base;
            return name;
        }

        function getClubColor(clubName) {
            const c = CLUB_COLORS[clubName];
            if (!c) { unmappedClubs.add(clubName); return UNKNOWN_CLUB; }
            return c;
        }

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
            return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
        }

        // Rebuild the legend from the clubs present across all events
        function buildLegend() {
            const legend = document.querySelector('.legend');
            if (!legend) return;
            const clubs = new Set();
            Object.values(eventsData).forEach(ev => ev.crews.forEach(c => clubs.add(getClubName(c.name))));
            const sorted = [...clubs].sort((a, b) => a === 'Galway' ? -1 : b === 'Galway' ? 1 : a.localeCompare(b));
            legend.innerHTML = sorted.map(club => {
                const col = getClubColor(club);
                const cls = club === 'Galway' ? 'legend-color galway' : 'legend-color';
                return `<div class="legend-item"><div class="${cls}" style="background:${col.primary};border-color:${col.secondary}"></div><span>${club}</span></div>`;
            }).join('');
            if (unmappedClubs.size) console.warn('Clubs without colours (grey fallback):', [...unmappedClubs]);
        }

        const eventModes = {};      // 'raw' or 'adjusted'
        const wattsMode = {};       // true/false for watts display
        const charts = {};

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(1);
            return `${mins}:${secs.padStart(4, '0')}`;
        }

        // Concept 2 formula: watts = 2.80 / pace³
        // where pace = time(seconds) / distance(meters)
        // For 1000m race: pace = time / 1000
        function timeToWatts(timeSeconds, distance = 1000) {
            const pace = timeSeconds / distance;
            return 2.80 / Math.pow(pace, 3);
        }

        function formatWatts(watts) {
            return Math.round(watts) + 'W';
        }

        function createChart(eventName, eventData, mode) {
            const canvasId = `chart-${eventName.replace(/\s+/g, '-')}`;
            const ctx = document.getElementById(canvasId).getContext('2d');

            const useAdjusted = mode === 'adjusted';
            const showWatts = wattsMode[eventName] || false;
            const totalCrews = eventData.totalCrews;

            // Sort crews by time and assign ranks (always by time, not watts)
            const sortedCrews = [...eventData.crews].sort((a, b) => {
                const timeA = useAdjusted ? a.adjusted : a.raw;
                const timeB = useAdjusted ? b.adjusted : b.raw;
                return timeA - timeB;
            });

            // Assign current ranks based on sorted order
            sortedCrews.forEach((c, i) => {
                c.currentRank = i + 1;
            });

            // Calculate watts for each crew
            const getDisplayValue = (c) => {
                const time = useAdjusted ? c.adjusted : c.raw;
                return showWatts ? timeToWatts(time) : time;
            };

            // Prepare data points — one dataset per club, in official club colours
            const toPoint = (c) => ({
                x: c.currentRank,
                y: getDisplayValue(c),
                label: c.name,
                club: getClubName(c.name),
                heat: c.heat,
                raw: c.raw,
                adjusted: c.adjusted,
                rawWatts: timeToWatts(c.raw),
                adjustedWatts: timeToWatts(c.adjusted),
                rank: c.currentRank
            });

            const byClub = {};
            sortedCrews.forEach(c => {
                const club = getClubName(c.name);
                (byClub[club] = byClub[club] || []).push(toPoint(c));
            });

            const clubDatasets = Object.keys(byClub).sort().map(club => {
                const col = getClubColor(club);
                const isGalway = club === 'Galway';
                return {
                    label: club,
                    data: byClub[club],
                    backgroundColor: hexToRgba(col.primary, isGalway ? 1 : 0.85),
                    borderColor: col.secondary,
                    borderWidth: isGalway ? 3 : 2,
                    pointRadius: isGalway ? 11 : 6,
                    pointHoverRadius: isGalway ? 14 : 9,
                    pointStyle: 'circle',
                    order: isGalway ? 0 : 1
                };
            });

            if (charts[eventName]) {
                charts[eventName].destroy();
            }

            charts[eventName] = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: clubDatasets
                },
                plugins: [highlightBarsPlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (evt, elements, chart) => {
                        if (!elements.length) return;
                        const { datasetIndex, index } = elements[0];
                        const pt = chart.data.datasets[datasetIndex].data[index];
                        if (pt.club === 'Galway') return;   // always highlighted
                        const set = selectedCrews[eventName] = selectedCrews[eventName] || new Set();
                        set.has(pt.label) ? set.delete(pt.label) : set.add(pt.label);
                        chart.update('none');
                    },
                    onHover: (evt, elements) => {
                        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const point = context.raw;
                                    const suffix = point.rank === 1 ? 'st' : point.rank === 2 ? 'nd' : point.rank === 3 ? 'rd' : 'th';
                                    return [
                                        `${point.rank}${suffix}: ${point.label}`,
                                        `Club: ${point.club}`,
                                        `Raw: ${formatTime(point.raw)} (${formatWatts(point.rawWatts)})`,
                                        `Adjusted: ${formatTime(point.adjusted)} (${formatWatts(point.adjustedWatts)})`,
                                        `Heat: ${point.heat}`
                                    ];
                                }
                            },
                            backgroundColor: 'rgba(29, 29, 36, 0.95)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            padding: 12,
                            cornerRadius: 6,
                            titleFont: { weight: 'bold' }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: 0,
                            max: totalCrews + 1,
                            title: {
                                display: true,
                                text: 'Position',
                                color: '#5c5c66',
                                font: { weight: '600', size: 12 }
                            },
                            ticks: {
                                stepSize: Math.max(1, Math.ceil(totalCrews / 10)),
                                callback: function(value) {
                                    if (value <= 0 || value > totalCrews) return '';
                                    const v = Math.round(value);
                                    const suffix = v === 1 ? 'st' : v === 2 ? 'nd' : v === 3 ? 'rd' : 'th';
                                    return v + suffix;
                                },
                                color: '#5c5c66',
                                font: { size: 10 }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.06)'
                            }
                        },
                        y: {
                            type: 'linear',
                            // Both time and watts: ascending order (0 at bottom, higher at top)
                            title: {
                                display: true,
                                text: showWatts
                                    ? (useAdjusted ? 'Heat-Adjusted Power (Watts)' : 'Raw Power (Watts)')
                                    : (useAdjusted ? 'Heat-Adjusted Time' : 'Raw Time'),
                                color: '#5c5c66',
                                font: { weight: '600', size: 12 }
                            },
                            ticks: {
                                callback: function(value) {
                                    return showWatts ? Math.round(value) + 'W' : formatTime(value);
                                },
                                color: '#5c5c66',
                                font: { size: 10 }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.06)'
                            }
                        }
                    }
                }
            });
            charts[eventName].$eventName = eventName;
        }



        function setEventMode(eventName, mode) {
            eventModes[eventName] = mode;

            const card = document.querySelector(`[data-event="${eventName}"]`);
            card.querySelectorAll('.time-toggle .toggle-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                }
            });

            createChart(eventName, eventsData[eventName], mode);
            updateGalwaySummary(eventName, eventsData[eventName], mode);
        }

        function toggleWatts(eventName) {
            wattsMode[eventName] = !wattsMode[eventName];

            const card = document.querySelector(`[data-event="${eventName}"]`);
            const wattsBtn = card.querySelector('.watts-toggle .toggle-btn');

            if (wattsMode[eventName]) {
                wattsBtn.classList.add('watts-active');
                wattsBtn.textContent = 'Show Time';
            } else {
                wattsBtn.classList.remove('watts-active');
                wattsBtn.textContent = 'Show Watts';
            }

            createChart(eventName, eventsData[eventName], eventModes[eventName] || 'raw');
            updateGalwaySummary(eventName, eventsData[eventName], eventModes[eventName] || 'raw');
        }

        function updateGalwaySummary(eventName, eventData, mode) {
            const card = document.querySelector(`[data-event="${eventName}"]`);
            const summaryContainer = card.querySelector('.galway-summary');
            const useAdjusted = mode === 'adjusted';
            const showWatts = wattsMode[eventName] || false;

            const galwaySummaryHTML = eventData.galwaySummary.map(g => {
                const displayRank = useAdjusted ? g.adjRank : g.rawRank;
                const changeClass = g.change > 0 ? 'positive' : (g.change < 0 ? 'negative' : 'neutral');
                const changeText = g.change > 0 ? `+${g.change}` : g.change.toString();

                // Parse time string to get raw seconds for watts calc
                const timeParts = g.rawTime.split(':');
                const rawSeconds = parseInt(timeParts[0]) * 60 + parseFloat(timeParts[1]);
                const watts = timeToWatts(rawSeconds);

                return `
                    <div class="galway-crew">
                        <h4>${g.name}</h4>
                        <div class="crew-stats">
                            <div class="crew-stat">
                                <div class="crew-stat-label">Heat</div>
                                <div class="crew-stat-value">${g.heat.split(' (')[0]}</div>
                            </div>
                            <div class="crew-stat">
                                <div class="crew-stat-label">${showWatts ? 'Power' : 'Time'}</div>
                                <div class="crew-stat-value">${showWatts ? formatWatts(watts) : g.rawTime}</div>
                            </div>
                            <div class="crew-stat">
                                <div class="crew-stat-label">${useAdjusted ? 'Adj Rank' : 'Rank'}</div>
                                <div class="crew-stat-value">${displayRank}/${eventData.totalCrews}</div>
                            </div>

                            ${eventData.hasToggle ? `
                            <div class="crew-stat">
                                <div class="crew-stat-label">Δ Rank</div>
                                <div class="crew-stat-value">
                                    <span class="position-change ${changeClass}">${changeText}</span>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            summaryContainer.innerHTML = galwaySummaryHTML;
        }

        function renderEvents() {
            let currentDay = null;

            for (const [eventName, eventData] of Object.entries(eventsData)) {
                if (eventData.day !== currentDay) {
                    currentDay = eventData.day;
                }

                const containerId = `${currentDay.toLowerCase()}-events`;
                const container = document.getElementById(containerId);

                eventModes[eventName] = 'raw';
                wattsMode[eventName] = false;

                const card = document.createElement('div');
                card.className = 'event-card';
                card.dataset.event = eventName;

                // Time adjustment toggle (only for sculling events)
                const timeToggleHTML = eventData.hasToggle ? `
                    <div class="toggle-container time-toggle">
                        <span class="toggle-label">Data:</span>
                        <button class="toggle-btn active" data-mode="raw" onclick="setEventMode('${eventName}', 'raw')">Raw</button>
                        <button class="toggle-btn" data-mode="adjusted" onclick="setEventMode('${eventName}', 'adjusted')">Adjusted</button>
                    </div>
                ` : '';

                // Watts toggle (for all events)
                const wattsToggleHTML = `
                    <div class="toggle-container watts-toggle">
                        <span class="toggle-label">Display:</span>
                        <button class="toggle-btn" onclick="toggleWatts('${eventName}')">Show Watts</button>
                    </div>
                `;

                const noteHTML = eventData.note ? `
                    <div class="highlight-box">
                        <h4>💡 Key Insight</h4>
                        <p>${eventData.note}</p>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="event-header">
                        <div class="event-title-section">
                            <h2 class="event-title">${eventName}</h2>
                            <div class="event-subtitle">Races ${eventData.races}</div>
                        </div>
                        <div class="event-stats">
                            <div class="stat">
                                <div class="stat-value">${eventData.totalCrews}</div>
                                <div class="stat-label">Crews</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${eventData.heats}</div>
                                <div class="stat-label">Finals</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${eventData.heatRange.toFixed(1)}s</div>
                                <div class="stat-label">Heat Δ</div>
                            </div>
                        </div>
                        <div class="toggle-row">
                            ${timeToggleHTML}
                            ${wattsToggleHTML}
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="chart-${eventName.replace(/\s+/g, '-')}"></canvas>
                    </div>
                    <div class="galway-summary"></div>
                    ${noteHTML}
                `;

                container.appendChild(card);
            }

            buildLegend();

            // Create charts after DOM ready
            for (const eventName of Object.keys(eventsData)) {
                createChart(eventName, eventsData[eventName], 'raw');
                updateGalwaySummary(eventName, eventsData[eventName], 'raw');
            }
        }

        renderEvents();
    </script>
</body>
</html>
